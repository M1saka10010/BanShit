  <rect x="14" y="14" width="1012" height="212" fill="none" stroke="#d9d2bc"/>
  <g font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" fill="#23201a">
    <text x="36" y="48" font-size="19" font-weight="700">编辑部流水线 / 快乐不是凭空印出来的</text>
    <g fill="#fcfaf2" stroke="#23201a" stroke-width="1.5">
      <path d="M36 73L246 71L248 150L34 152Z"/>
